[project]
name = "real-estate-actual-price"
version = "0.1.0"
description = "Personal Taiwan actual-price transaction search with web/PWA and MCP access"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-temp"
